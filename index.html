<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Ferretería - Gestión de Almacén</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sistema de Inventario - Ferretería</h1>
        <p>Control de existencias, facturación con IVA y movimientos</p>
    </header>

    <main class="container">
        <!-- Sección de Alerta Global -->
        <div id="alerta-agotados" class="alerta oculto"></div>

        <!-- Formulario de Ingreso -->
        <section class="card">
            <h2>Registrar / Actualizar Producto</h2>
            <form id="form-producto">
                <div class="grid-form">
                    <div class="campo">
                        <label for="id">ID del Producto</label>
                        <input type="text" id="id" placeholder="Ej. FER-001" required>
                    </div>
                    <div class="campo">
                        <label for="nombre">Nombre del Producto</label>
                        <input type="text" id="nombre" placeholder="Ej. Martillo de uña 16oz" required>
                    </div>
                    <div class="campo">
                        <label for="cantidad">Cantidad (Stock)</label>
                        <input type="number" id="cantidad" min="0" placeholder="0" required>
                    </div>
                    <div class="campo">
                        <label for="precio">Precio Unitario (Sin IVA)</label>
                        <input type="number" id="precio" min="0" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="campo">
                        <label for="iva-porcentaje">Porcentaje IVA (%)</label>
                        <input type="number" id="iva-porcentaje" value="19" min="0" max="100" required>
                    </div>
                    <div class="campo">
                        <label for="fecha-compra">Fecha de Compra</label>
                        <input type="date" id="fecha-compra" required>
                    </div>
                    <div class="campo">
                        <label for="fecha-venta">Fecha de Última Venta (Opcional)</label>
                        <input type="date" id="fecha-venta">
                    </div>
                </div>
                <div class="acciones-form">
                    <button type="submit" class="btn-primario">Guardar en Inventario</button>
                    <button type="button" id="btn-limpiar" class="btn-secundario">Limpiar</button>
                </div>
            </form>
        </section>

        <!-- Visualización en Filas (Tabla) -->
        <section class="card">
            <div class="header-tabla">
                <h2>Inventario del Almacén</h2>
                <input type="text" id="buscador" placeholder="Buscar por ID o nombre...">
            </div>
            <div class="tabla-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Cantidad</th>
                            <th>Precio Base</th>
                            <th>IVA Calculado</th>
                            <th>Precio + IVA</th>
                            <th>Fecha Compra</th>
                            <th>Fecha Venta</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-inventario">
                        <!-- Las filas se generan dinámicamente con JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
